<svg xmlns="http://www.w3.org/2000/svg" width="820" height="240" viewBox="0 0 820 240" font-family="-apple-system, Inter, Segoe UI, sans-serif">
  <rect width="820" height="240" fill="#0a0c10"/>
  <text x="24" y="34" fill="#eef2f4" font-size="16" font-weight="600">Raposa — human approval gate</text>
  <text x="24" y="54" fill="#8b96a3" font-size="12">Manual Trigger → Raposa &#8220;Ask and Wait&#8221; → the step that must not run without a yes</text>

  <!-- node 1 -->
  <rect x="24" y="96" width="180" height="72" rx="12" fill="#12161c" stroke="rgba(255,255,255,.14)"/>
  <text x="114" y="128" fill="#eef2f4" font-size="13" text-anchor="middle" font-weight="600">Execute workflow</text>
  <text x="114" y="148" fill="#8b96a3" font-size="11" text-anchor="middle">Manual Trigger</text>

  <!-- arrow -->
  <line x1="204" y1="132" x2="300" y2="132" stroke="#4de3ee" stroke-width="2"/>
  <polygon points="300,127 312,132 300,137" fill="#4de3ee"/>

  <!-- node 2 -->
  <rect x="312" y="88" width="196" height="88" rx="12" fill="#12161c" stroke="#c6f24b"/>
  <text x="410" y="118" fill="#eef2f4" font-size="13" text-anchor="middle" font-weight="600">Raposa Approval</text>
  <text x="410" y="137" fill="#c6f24b" font-size="11" text-anchor="middle">Ask and Wait · risk: high</text>
  <text x="410" y="155" fill="#8b96a3" font-size="10.5" text-anchor="middle">continues only if a human approves</text>

  <!-- arrow -->
  <line x1="508" y1="132" x2="604" y2="132" stroke="#4de3ee" stroke-width="2"/>
  <polygon points="604,127 616,132 604,137" fill="#4de3ee"/>

  <!-- node 3 -->
  <rect x="616" y="96" width="180" height="72" rx="12" fill="#12161c" stroke="rgba(255,255,255,.14)"/>
  <text x="706" y="124" fill="#eef2f4" font-size="12.5" text-anchor="middle" font-weight="600">Do the refund</text>
  <text x="706" y="142" fill="#8b96a3" font-size="11" text-anchor="middle">only after approval</text>

  <text x="24" y="210" fill="#8b96a3" font-size="11">Reject or timeout throws — silence is never consent. Import docs/example-workflow.json to try it.</text>
  <text x="24" y="228" fill="#5a6570" font-size="10.5">Requires an approver on your account (portal → approvers, or Slack/Telegram). A self-service sandbox key sets your email as the default approver.</text>
</svg>
