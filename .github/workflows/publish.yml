# Publishes n8n-nodes-raposa to npm via Trusted Publishing (OIDC) with provenance.
# No npm token: npmjs.com is configured with this repo + this workflow as a
# Trusted Publisher, so publish authenticates through the workflow's OIDC id-token.
# n8n verified community nodes require the provenance attestation (since 2026-05-01):
# https://docs.n8n.io/integrations/community-nodes/building-community-nodes/
#
# Requirements for OIDC trusted publishing:
#   - permissions.id-token: write   (mint the OIDC token)
#   - Node >= 22.14 and npm >= 11.5.1 (OIDC support in the npm CLI)
#   - no NODE_AUTH_TOKEN / registry-url secret auth (not needed, and it overrides OIDC)
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package version
        run: |
          node - <<'JS'
          const version = require('./package.json').version;
          const expected = `v${version}`;
          if (process.env.GITHUB_REF_NAME !== expected) {
            throw new Error(`release tag ${process.env.GITHUB_REF_NAME} does not match ${expected}`);
          }
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
      - name: Upgrade npm to a version with OIDC trusted publishing support
        # npm@11 (>=11.5.1) supports OIDC and is compatible with Node 22.x.
        # npm@latest is 12.x, which requires Node >=22.22.2 and would break the pin.
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run scan:community
      - run: npm audit --omit=dev
      - name: Pack exact release candidate
        run: |
          npm pack --json > /tmp/npm-pack.json
          node - <<'JS'
          const fs = require('node:fs');
          const packed = JSON.parse(fs.readFileSync('/tmp/npm-pack.json', 'utf8'))[0];
          const pkg = require('./package.json');
          fs.appendFileSync(process.env.GITHUB_ENV, `PACKAGE_SPEC=${pkg.name}@${pkg.version}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `LOCAL_TARBALL_SHA1=${packed.shasum}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_TARBALL=${packed.filename}\n`);
          JS
      - run: npm publish "$RELEASE_TARBALL" --provenance --access public
      - name: Verify registry artifact and provenance
        run: node scripts/verify-published.mjs "$PACKAGE_SPEC" "$LOCAL_TARBALL_SHA1"
      - name: Scan exact published package
        run: npm run scan:community -- "$PACKAGE_SPEC"
