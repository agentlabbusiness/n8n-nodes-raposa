# Publishes n8n-nodes-raposa to npm via Trusted Publishing (OIDC) with provenance.
# No npm token: npmjs.com is configured with this repo + this workflow as a
# Trusted Publisher, so publish authenticates through the workflow's OIDC id-token.
# n8n verified community nodes require the provenance attestation (since 2026-05-01):
# https://docs.n8n.io/integrations/community-nodes/building-community-nodes/
#
# Requirements for OIDC trusted publishing:
#   - permissions.id-token: write   (mint the OIDC token)
#   - Node >= 22.14 and npm >= 11.5.1 (OIDC support in the npm CLI)
#   - no NODE_AUTH_TOKEN / registry-url secret auth (not needed, and it overrides OIDC)
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
      - name: Upgrade npm to a version with OIDC trusted publishing support
        # npm@11 (>=11.5.1) supports OIDC and is compatible with Node 22.x.
        # npm@latest is 12.x, which requires Node >=22.22.2 and would break the pin.
        run: npm install -g npm@11
      - name: OIDC / npm diagnostics
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"
          echo "id-token request url present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "id-token request token present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm publish --provenance --access public
