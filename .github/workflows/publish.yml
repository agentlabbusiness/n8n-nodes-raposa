# Publishes n8n-nodes-raposa to npm with a provenance statement.
# n8n verified community nodes require this path since 2026-05-01
# (https://docs.n8n.io/integrations/community-nodes/building-community-nodes/).
# Auth: the NPM_TOKEN repository secret (granular publish token from 1Password Dev-API/npm).
# Provenance is attested through the workflow's OIDC id-token regardless of the auth method.
# Optional upgrade: configure npm Trusted Publishing on npmjs.com and drop the secret.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # granular publish token; provenance still comes from the OIDC id-token
